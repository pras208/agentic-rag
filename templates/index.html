<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic RAG POC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .status-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ecff;
            transform: scale(1.02);
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #666;
            font-size: 0.95em;
        }

        .file-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            background: #f8f9ff;
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            font-size: 0.9em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-status {
            font-size: 0.8em;
            color: #667eea;
            font-weight: 600;
        }

        .query-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            margin-bottom: 15px;
            font-family: inherit;
        }

        .query-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .response-area {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            min-height: 300px;
        }

        .response-area h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .response-content {
            color: #333;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
            max-height: 500px;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 6px;
            min-height: 200px;
        }

        .response-empty {
            color: #999;
            font-style: italic;
        }

        .loading {
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.8em;
            color: #999;
            margin-top: 5px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #3c3;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Agentic RAG POC</h1>
            <p class="subtitle">Upload documents, ask questions, get intelligent answers</p>
            <div class="status-badge">
                Indexed: <span id="docCount">0</span> documents
            </div>
        </header>

        <div class="main-grid">
            <!-- Upload Section -->
            <div class="card">
                <h2>📄 Upload Documents</h2>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <div class="upload-text">
                        <strong>Click to upload</strong> or drag and drop<br>
                        <small>PDF, TXT, or MD (max 50MB)</small>
                    </div>
                </div>
                <input type="file" id="fileInput" accept=".pdf,.txt,.md">
                <div class="file-list" id="fileList"></div>
                <div class="stats" id="stats"></div>
            </div>

            <!-- Query Section -->
            <div class="card">
                <h2>❓ Ask Questions</h2>
                <textarea
                    id="queryInput"
                    class="query-input"
                    placeholder="Ask anything about your documents..."
                    rows="4"
                ></textarea>
                <button class="button" id="submitBtn" onclick="submitQuery()">
                    Send Query
                </button>
                <div id="message" style="margin-top: 15px;"></div>
            </div>
        </div>

        <!-- Response Section -->
        <div class="response-area">
            <h2>💭 Response</h2>
            <div class="response-content" id="responseContent">
                <span class="response-empty">Responses will appear here...</span>
            </div>
        </div>
    </div>

    <script>
        // Update status on load
        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('docCount').textContent = data.indexed_documents;
            } catch (e) {
                console.error('Failed to update status:', e);
            }
        }

        // Upload handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');

        uploadArea.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.remove('dragover');
            });
        });

        uploadArea.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        async function handleFiles(files) {
            for (let file of files) {
                await uploadFile(file);
            }
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.innerHTML = `
                <span>${file.name}</span>
                <span class="file-status">Uploading...</span>
            `;
            fileList.appendChild(fileItem);

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.status === 'success') {
                    fileItem.innerHTML = `
                        <span>${file.name}</span>
                        <span class="file-status">✓ ${data.chunks_indexed} chunks</span>
                    `;
                    updateStatus();
                } else {
                    fileItem.innerHTML = `
                        <span>${file.name}</span>
                        <span class="file-status" style="color: red;">✗ Error</span>
                    `;
                }
            } catch (e) {
                fileItem.innerHTML = `
                    <span>${file.name}</span>
                    <span class="file-status" style="color: red;">✗ Failed</span>
                `;
            }
        }

        // Query handling
        async function submitQuery() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) return;

            const btn = document.getElementById('submitBtn');
            const responseContent = document.getElementById('responseContent');
            const message = document.getElementById('message');

            btn.disabled = true;
            btn.textContent = 'Processing...';
            responseContent.innerHTML = '<span class="loading">⏳ Thinking...</span>';
            message.innerHTML = '';

            try {
                const res = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                if (!res.ok) throw new Error('Query failed');

                responseContent.innerHTML = '';
                const reader = res.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split('\n');

                    for (let line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.substring(6);
                            if (data === '[DONE]') {
                                continue;
                            }
                            if (data.startsWith('ERROR:')) {
                                responseContent.innerHTML += `<span style="color: red;">${data}</span>`;
                            } else {
                                responseContent.innerHTML += data;
                            }
                            responseContent.scrollTop = responseContent.scrollHeight;
                        }
                    }
                }

                message.innerHTML = '<div class="success">✓ Response complete</div>';
            } catch (e) {
                responseContent.innerHTML = `<span class="response-empty">Error: ${e.message}</span>`;
                message.innerHTML = `<div class="error">✗ ${e.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Query';
            }
        }

        // Allow Enter key to submit
        document.getElementById('queryInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                submitQuery();
            }
        });

        // Load status on page load
        updateStatus();
    </script>
</body>
</html>
